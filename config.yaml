# ---------------------------------------------------------------------------
# Deglobalization Digest — configuration
#
# Three source types are supported:
#   rss        : any RSS/Atom feed (news feeds and podcast feeds)
#   html_links : a listing page whose article links match a regex pattern
#   jpmam_json : J.P. Morgan Asset Management's AEM editorial JSON endpoint
#
# Add or remove sources freely; the pipeline treats them uniformly.
# ---------------------------------------------------------------------------

digest:
  # Items with a publish date are included only if published within this
  # many days of the run.
  lookback_days: 8
  # Scraped listing pages (asset manager sites) expose no dates, so for
  # relevant items the agent fetches the article page and reads the publish
  # date from it. Items older than this are dropped; the window is looser
  # than lookback_days because asset managers publish monthly/quarterly.
  scraped_max_age_days: 45
  # Max article-page date lookups per source per run (keeps runs fast).
  date_lookup_limit: 12
  # Minimum relevance score for an item to make the digest (see scoring below).
  min_score: 3
  # Caps to keep the email readable.
  max_items_per_source: 6
  max_items_total: 40
  # On the very first run there is no "seen" state, so undated scraped pages
  # would flood the digest with their whole archive. Cap them harder.
  first_run_max_per_source: 4
  subject_prefix: "Deglobalization Weekly"

state_file: state/seen.json

sources:
  # ---- Wall Street Journal (public RSS) -----------------------------------
  - name: WSJ Markets
    type: rss
    url: https://feeds.content.dowjones.io/public/rss/RSSMarketsMain
    category: news
  - name: WSJ World News
    type: rss
    url: https://feeds.content.dowjones.io/public/rss/RSSWorldNews
    category: news
  - name: WSJ US Business
    type: rss
    url: https://feeds.content.dowjones.io/public/rss/WSJcomUSBusiness
    category: news
  - name: WSJ Tech
    type: rss
    url: https://feeds.content.dowjones.io/public/rss/RSSWSJD
    category: news
  - name: WSJ Opinion
    type: rss
    url: https://feeds.content.dowjones.io/public/rss/RSSOpinion
    category: news

  # ---- Podcasts ------------------------------------------------------------
  - name: Odd Lots (Bloomberg)
    type: rss
    url: https://www.omnycontent.com/d/playlist/e73c998e-6e60-432f-8610-ae210140c5b1/8a94442e-5a74-4fa2-8b8d-ae27003a8d6b/982f5071-765c-403d-969d-ae27003a8d83/podcast.rss
    category: podcast
  - name: The Compound and Friends (Ritholtz)
    type: rss
    url: https://feeds.megaphone.fm/TCP4771071679
    category: podcast
  - name: Animal Spirits (Ritholtz)
    type: rss
    url: https://feeds.megaphone.fm/TCP6464651487
    category: podcast
  - name: Eye on the Market podcast (Michael Cembalest)
    type: rss
    url: https://feed.podbean.com/eyeonthemarket/feed.xml
    category: podcast

  # ---- J.P. Morgan ----------------------------------------------------------
  - name: JPM Eye on the Market & Private Bank insights
    type: html_links
    url: https://privatebank.jpmorgan.com/nam/en/insights/eye-on-the-market
    link_pattern: 'href="(/nam/en/insights/[^"#?]+)"'
    base_url: https://privatebank.jpmorgan.com
    # Skip section/landing pages: require a slug at least two levels deep.
    min_path_depth: 5
    category: asset_manager
  - name: JPMAM On the Minds of Investors
    type: jpmam_json
    url: https://am.jpmorgan.com/content/jpm-am-aem/americas/us/en/adv/insights/market-insights/market-updates/on-the-minds-of-investors/jcr:content/root/responsivegrid/jpm_am_editorial_lan.model.json
    base_url: https://am.jpmorgan.com
    category: asset_manager

  # ---- Other asset managers --------------------------------------------------
  - name: MFS Investments insights
    type: html_links
    url: https://www.mfs.com/en-us/investment-professional/insights.html
    link_pattern: 'href="((?:/content/mfs-enterprise/mfscom/us)?/en-?us?/investment-professional/(?:insights|mfs-podcasts)/[^"#?]+\.html)"'
    base_url: https://www.mfs.com
    category: asset_manager
  - name: Columbia Threadneedle insights
    type: html_links
    url: https://www.columbiathreadneedle.com/en/gb/institutional/insights/
    link_pattern: 'href="(https://www\.columbiathreadneedle\.com/en/gb/institutional/insights/[^"#?]+/)"'
    category: asset_manager
  - name: Baillie Gifford insights
    type: html_links
    url: https://www.bailliegifford.com/en/usa/institutional-investor/insights/
    link_pattern: 'href="((?:https://www\.bailliegifford\.com)?/en/usa/institutional-investor/insights/[a-z-]+/[^"#?]+/)"'
    base_url: https://www.bailliegifford.com
    category: asset_manager

  # To add another manager, find its insights listing page, view the page
  # source, and write a link_pattern regex whose first capture group is the
  # article URL (absolute, or relative combined with base_url).

# ---------------------------------------------------------------------------
# Relevance scoring.
#
# Each keyword hit in the title or summary adds its group's weight to the
# item's score; hits in the title count double. Keywords are matched on word
# boundaries, case-insensitively. An item needs digest.min_score to qualify.
# The first (highest-weight) group an item matches decides which section of
# the email it appears under.
# ---------------------------------------------------------------------------
